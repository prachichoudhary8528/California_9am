<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>California House Price Predictor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <div class="container">

        <h1>California House Price Predictor</h1>

        <p class="subtitle">
            Enter the details of the house
        </p>


        <form id="predictionForm">

            {% for column in columns %}

            <div class="form-group">

                <label for="{{ column }}">
                    {{ column }}
                </label>

                <input
                    type="number"
                    step="any"
                    id="{{ column }}"
                    name="{{ column }}"
                    placeholder="Enter {{ column }}"
                    required
                >

            </div>

            {% endfor %}


            <button type="submit">
                Predict House Price
            </button>

        </form>


        <div id="result"></div>

    </div>


    <script>

        document
            .getElementById("predictionForm")
            .addEventListener("submit", async function(event) {

                // Stop page from refreshing
                event.preventDefault();

                // Get form
                const form = event.target;

                // Convert form values into URL parameters
                const params = new URLSearchParams(
                    new FormData(form)
                );

                try {

                    // Send data to Flask
                    const response = await fetch(
                        "/predict?" + params.toString()
                    );

                    // Get prediction
                    const result = await response.text();

                    // Display prediction
                    document.getElementById("result").innerHTML =
                        "Predicted House Price: $" + result;

                }

                catch (error) {

                    document.getElementById("result").innerHTML =
                        "Error: " + error;

                }

            });

    </script>

</body>

</html>
